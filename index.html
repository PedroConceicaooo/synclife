<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121722" media="(prefers-color-scheme: dark)" />
  <title>SyncLife</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="src/ui/style.css" />
</head>
<body>
  <main id="start-screen" hidden>
    <div id="start-brand">
      <h1 id="start-title">SyncLife</h1>
      <p id="start-tagline"></p>
    </div>

    <div id="start-choice">
      <button id="start-random" type="button"></button>
      <button id="start-custom" class="secondary" type="button"></button>
    </div>

    <form id="start-form" hidden>
      <label for="start-name" id="start-name-label"></label>
      <input id="start-name" name="firstName" type="text" maxlength="30" autocomplete="off" />

      <fieldset id="start-sex">
        <legend id="start-sex-label"></legend>
      </fieldset>

      <fieldset id="start-country">
        <legend id="start-country-label"></legend>
      </fieldset>

      <label for="start-city" id="start-city-label"></label>
      <select id="start-city" name="cityId"></select>

      <div id="start-form-actions">
        <button id="start-begin" type="submit"></button>
        <button id="start-back" class="secondary" type="button"></button>
      </div>
    </form>

    <p id="disclaimer"></p>
  </main>

  <div id="app" hidden>
    <header id="top">
      <p id="brand">SyncLife</p>
      <div id="identity">
        <div id="top-avatar"></div>
        <div id="top-identity">
          <p id="top-name"></p>
          <p id="top-phase"></p>
        </div>
        <div id="top-balance">
          <p id="top-money"></p>
          <p id="top-money-label"></p>
        </div>
      </div>
    </header>

    <main id="screens">
      <section id="life-screen" aria-live="polite">
        <ol id="diary"></ol>
        <section id="summary" hidden>
          <h1 id="summary-title"></h1>
          <p id="summary-personality"></p>
          <h2 id="summary-stats-title"></h2>
          <div id="summary-stats"></div>
          <h2 id="summary-milestones-title"></h2>
          <ul id="summary-milestones"></ul>
          <h2 id="summary-relations-title"></h2>
          <ul id="summary-relations"></ul>
        </section>
      </section>

      <section id="relations-screen" hidden>
        <h1 id="relations-title"></h1>
        <ul id="relations-list" class="people-list"></ul>
      </section>

      <section id="school-screen" hidden>
        <h1 id="school-title"></h1>
        <p id="school-empty"></p>
        <h2 id="school-classmates-title"></h2>
        <ul id="school-classmates" class="people-list"></ul>
        <h2 id="school-teachers-title"></h2>
        <ul id="school-teachers" class="people-list"></ul>
        <h2 id="school-teams-title"></h2>
        <div id="school-teams"></div>
      </section>

      <section id="profile-screen" hidden>
        <button id="profile-back" class="back" type="button"></button>
        <h1 id="profile-title"></h1>
        <p id="profile-subtitle"></p>
        <p id="profile-traits"></p>
        <div id="profile-affinity"></div>
        <p id="profile-result" role="status"></p>
        <div id="profile-interactions"></div>
      </section>

      <section id="assets-screen" hidden>
        <h1 id="assets-title"></h1>
        <p id="assets-result" role="status"></p>
        <div id="assets-owned"></div>
        <div id="assets-shop"></div>
      </section>

      <section id="activities-screen" hidden>
        <header class="page-head">
          <button id="activities-back" class="page-back" type="button" hidden></button>
          <div>
            <p id="activities-trail" class="trail"></p>
            <h1 id="activities-title"></h1>
          </div>
        </header>
        <p id="activities-result" role="status"></p>
        <div id="activities-list"></div>
      </section>
    </main>

    <nav id="controls">
      <div id="advance" hidden></div>
      <div id="tabbar"></div>
    </nav>

    <footer id="stats-area">
      <p id="mood"></p>
      <div id="stats"></div>
    </footer>
  </div>

  <section id="decision-modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="decision-prompt">
      <p id="decision-prompt"></p>
      <div id="decision-options"></div>
    </div>
  </section>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
